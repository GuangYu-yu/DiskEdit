[package]
name = "DiskEdit"
version = "0.1.0"
edition = "2024"
description = "Edit disk images / whole disks as byte-addressable files: partition tables (GPT/MBR), FS identification, mkfs/resize via external tools, partition relocation with resumable checkpoints"
license = "MIT"

[dependencies]
gptman = "3.1"
crc = "3"
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[features]
# 测试专用
test-faults = []

[profile.release]
lto = true

[lints.clippy]
# 有意忽略错误必须落在 best_effort_* / warn_* 这类命名函数内（并在该函数上 #[allow]），
# 这样"裸 let _ ="可被静态检查拦住。lint 只能发现"结果被丢弃"，
# "忽略是否安全"仍由函数命名与类型表达，二者配合才可机械审计
let_underscore_must_use = "deny"