name: 全量测试

# 手动触发的全量测试。
on:
  workflow_dispatch:

jobs:
  lint:
    name: clippy / fmt（警告即失败）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rebuild
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rebuild
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo fmt --check

  cargo-test:
    name: cargo test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rebuild
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rebuild
      - run: cargo test --all-targets

  discipline:
    # 纪律守卫需要完整历史：足迹 diff <基线>..HEAD，提交信息逐条主题。
    name: 足迹与提交信息纪律
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rebuild
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 plan/instruments/footprint.py
      - run: python3 plan/instruments/commits.py
