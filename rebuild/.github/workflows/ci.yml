name: rebuild

on:
  push:
    paths:
      - "rebuild/**"
  pull_request:
    paths:
      - "rebuild/**"

jobs:
  compile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rebuild
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo check --all-targets
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo fmt --check

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rebuild
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
